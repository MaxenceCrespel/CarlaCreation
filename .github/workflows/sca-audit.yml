name: SCA Dependency Scan

on:
  workflow_call:

jobs:
  SCA-Dependency-Scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit des dépendances API (Backend)
        run: |
          cd api
          npm install
          # --omit=dev: le build de prod (api/Dockerfile) fait `npm prune --omit=dev`
          # avant de livrer l'image — les devDependencies (Jest, ts-jest...) ne sont
          # jamais expédiées, donc les auditer ferait échouer la CI sur des CVE
          # inatteignables en prod (ex: brace-expansion via une vieille version
          # transitive de rimraf/glob dans Jest, sans fix non-breaking disponible).
          #
          # `npm audit` n'a pas de mécanisme d'exception natif (contrairement à
          # Trivy + .trivyignore) — check-npm-audit.js rejoue le même principe :
          # tout ce qui n'est pas documenté dans .npmauditignore fait échouer le job.
          npm audit --omit=dev --audit-level=high --json > /tmp/npm-audit.json || true
          node scripts/check-npm-audit.js /tmp/npm-audit.json .npmauditignore
      - name: Audit des dépendances Client (Frontend)
        run: |
          cd client
          npm install
          npm audit --audit-level=high || true
