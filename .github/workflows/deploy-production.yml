name: Deploy Production

# Volontairement PAS appelé depuis main.yml (contrairement à Deploy
# Staging, qui se relance à chaque push sur main/master) — la prod ne doit
# jamais se déployer tout seule : argent réel, clés Stripe live. Se
# déclenche uniquement à la main depuis l'onglet Actions de GitHub ("Run
# workflow"), ce qui demande déjà une action humaine déliberée ; le champ
# `confirm` ci-dessous est une seconde barrière contre un clic distrait.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tapez "deploy" pour confirmer (déploie en production, argent réel)'
        required: true
      ref:
        description: 'Branche ou tag à déployer en production'
        required: true
        default: main

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    env:
      DEPLOY_REF: ${{ github.event.inputs.ref }}
    steps:
      - name: Déploiement Continu via SSH sur le VPS (production)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: DEPLOY_REF
          script: |
            set -e
            cd /opt/carla-prod
            git fetch origin "$DEPLOY_REF"
            git checkout "$DEPLOY_REF"
            git pull origin "$DEPLOY_REF"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker compose exec -T web npm run migration:run
