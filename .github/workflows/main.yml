name: Pipeline CI/CD CarlaCreation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 7 * * *"

permissions:
  security-events: write
  contents: read
  actions: read
  issues: write
  packages: write

jobs:
  Linter-and-Tests:
    uses: ./.github/workflows/linter-tests.yml

  Secret-Scanning:
    if: github.event_name != 'push'
    uses: ./.github/workflows/secret-scan.yml

  SAST-Semgrep:
    needs: Linter-and-Tests
    if: github.event_name != 'push'
    uses: ./.github/workflows/sast-semgrep.yml

  SCA-Dependency-Scan:
    needs: Linter-and-Tests
    if: github.event_name != 'push'
    uses: ./.github/workflows/sca-audit.yml

  IaC-Security-Checkov:
    if: github.event_name != 'push'
    uses: ./.github/workflows/iac-checkov.yml

  Docker-Build-and-Security:
    needs: Linter-and-Tests
    if: github.event_name != 'push'
    uses: ./.github/workflows/docker-build.yml

  Load-Testing:
    needs: Docker-Build-and-Security
    if: github.event_name != 'push'
    uses: ./.github/workflows/load-testing.yml

  DAST-OWASP-ZAP:
    needs: Docker-Build-and-Security
    if: github.event_name != 'push'
    uses: ./.github/workflows/dast-zap.yml

  E2E-Cypress:
    needs: Docker-Build-and-Security
    if: github.event_name != 'push'
    uses: ./.github/workflows/e2e-cypress.yml

  # Déploiement automatique en production (carlacreation.fr) à chaque push sur
  # main. La pull request a déjà passé toute la pipeline (sécurité, Docker,
  # E2E, charge) : sur main on ne rejoue que lint + tests unitaires avant de
  # déployer, le déploiement ayant sa propre sauvegarde, son healthcheck et son
  # rollback. La pipeline complète tourne aussi chaque nuit. Jamais sur une
  # pull request.
  Deploy-Production:
    needs: [Linter-and-Tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    uses: ./.github/workflows/deploy-production.yml
    with:
      ref: main
    secrets: inherit
